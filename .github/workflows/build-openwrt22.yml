name: OpenWrt 22.03 SDK

on:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Download OpenWrt 22.03 SDK
        run: |
          mkdir sdk
          cd sdk

          wget https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621/openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

          tar -xf openwrt-sdk-22.03.4-ramips-mt7621*.tar.xz

      - name: Locate SDK
        id: sdk
        run: |
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name "openwrt-sdk-*")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK Directory:"
          echo "$SDK_DIR"

      - name: Add helloworld feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default

          echo
          echo "===== feeds.conf.default ====="
          tail -n 5 feeds.conf.default

      - name: Update helloworld feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update helloworld

      - name: Install luci-app-ssr-plus only
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds install luci-app-ssr-plus

      - name: Show installed package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          find package -name "luci-app-ssr-plus" || true
          find feeds -name "luci-app-ssr-plus" || true
