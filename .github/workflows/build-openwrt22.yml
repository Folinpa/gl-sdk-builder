name: OpenWrt 22.03 SDK

on:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Download OpenWrt 22.03 SDK
        run: |
          mkdir -p sdk
          cd sdk

          wget -q https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621/openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

          tar -xf openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

          ls -la

      - name: Locate SDK
        run: |
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name "openwrt-sdk-*")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK Directory: $SDK_DIR"

      - name: Add helloworld feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default

          echo
          echo "===== Last lines of feeds.conf.default ====="
          tail -n 5 feeds.conf.default

      - name: Update and install helloworld
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update helloworld
          ./scripts/feeds install -p helloworld -f luci-app-ssr-plus

      - name: Verify package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "===== package ====="
          find package -name "luci-app-ssr-plus" || true

          echo
          echo "===== feeds ====="
          find feeds -name "luci-app-ssr-plus" || true

          echo
          echo "===== package/feeds ====="
          find package/feeds -name "luci-app-ssr-plus" || true

          echo
          echo "===== grep ====="
          grep -R "luci-app-ssr-plus" feeds.conf.default feeds package 2>/dev/null | head -30
