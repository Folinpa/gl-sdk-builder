name: OpenWrt 22.03 SDK

on:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Download OpenWrt SDK
        run: |
          mkdir sdk
          cd sdk

          wget https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621/openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

          tar -xf openwrt-sdk-22.03.4-ramips-mt7621*.tar.xz

          ls -la

      - name: Show SDK
        run: |
          find sdk -maxdepth 2
