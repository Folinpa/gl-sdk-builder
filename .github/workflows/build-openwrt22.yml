name: OpenWrt 22.03 SDK

on:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Download OpenWrt 22.03 SDK
        run: |
          mkdir -p sdk
          cd sdk

          wget -q https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621/openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

          tar -xf openwrt-sdk-22.03.4-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz

      - name: Locate SDK
        run: |
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name "openwrt-sdk-*")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK Directory: $SDK_DIR"

      - name: Add helloworld feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default

      - name: Update all feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a

      - name: Install all feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds install -a -f

      - name: Verify LuCI
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "===== feeds ====="
          ls feeds

          echo
          echo "===== luci.mk ====="
          find feeds/luci -name luci.mk

      - name: Generate default config
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make defconfig

      - name: Compile luci-app-ssr-plus
        working-directory: ${{ env.SDK_DIR }}
        run: |
          time make package/feeds/helloworld/luci-app-ssr-plus/compile V=s

      - name: List build outputs
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "===== BIN ====="
          find bin -type f | sort

          echo
          echo "===== IPK ====="
          find . -name "*.ipk" | sort

          echo
          echo "===== BUILDINFO ====="
          find . -name "*.buildinfo" | sort

          echo
          echo "===== MANIFEST ====="
          find . -name "*.manifest" | sort

          echo
          echo "===== PACKAGES ====="
          find . -name "Packages*" | sort

          echo
          echo "===== SUMMARY ====="
          echo "IPK count:"
          find . -name "*.ipk" | wc -l

          echo
          echo "Total bin size:"
          du -sh bin
